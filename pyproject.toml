[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yotsuba-ink"
version = "0.1.0"
description = "Yotsuba Ink: an open-source, AI-native workbench for long-form fiction production."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [
    {name = "Yotsuba Ink Contributors"},
]
keywords = ["yotsuba-ink", "story-bible", "long-form-fiction", "llm-orchestration", "rag", "quality-gates"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "openai>=2.46.0,<3.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.urls]
Homepage = "https://github.com/isla4ever/yotsuba-ink"
Repository = "https://github.com/isla4ever/yotsuba-ink"
Documentation = "https://github.com/isla4ever/yotsuba-ink#readme"
Issues = "https://github.com/isla4ever/yotsuba-ink/issues"

[project.scripts]
novel-workflow-api = "novel_workflow.api.run:main"
novel-workflow-provider-smoke = "novel_workflow.providers.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["novel_workflow*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
