[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-workflow-model-end"
version = "0.1.0"
description = "Novel Workflow: an open-source long-form fiction orchestration service with approval gates, Story Bible memory, and quality loops."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [
    {name = "Novel Workflow Contributors"},
]
keywords = ["novel-workflow", "story-bible", "long-form-fiction", "llm-orchestration", "rag", "quality-gates"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "requests>=2.31.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
legacy-training = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "peft>=0.11.0",
    "accelerate>=0.30.0",
    "filelock>=3.12.0",
    "duckduckgo-search>=6.0.0",
    "swanlab>=0.3.0",
    "datasets>=2.14.0",
]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0"]

[project.urls]
Homepage = "https://github.com/your-org/novel-workflow"

[project.scripts]
novel-workflow-api = "novel_workflow.api.run:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["novel_workflow*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
